# Prometheus scrape configuration for the Agentic Blog Writer.
#
# This tells Prometheus which endpoints to scrape and how often.
# The API exposes Prometheus metrics at /api/v1/metrics.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "agentic-blog-api"
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          application: agentic-blog-api