name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AUTH_REQUIRED: "false"
      ENABLE_IMAGES: "false"
      GROQ_API_KEY: "test-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app tests scripts
      - name: Validate Grafana dashboard JSON
        run: python -m json.tool grafana/provisioning/dashboards/agentic_overview.json > /dev/null
      - run: pytest -q
